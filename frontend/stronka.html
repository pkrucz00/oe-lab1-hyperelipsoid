<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hyperllipsoid</title>
    <link rel="stylesheet" href="style.css">
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background-color: #121212;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }
        form {
            margin-bottom: 50px;
            width: 80vw;
            margin-top: 130px;
            height: 120vh;
            background: #1e1e1e;
            border-radius: 12px;
            box-shadow: 0 0 15px rgba(255, 255, 255, 0.1);
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        h2 {
            font-size: 36px;
            font-style: bold;
            margin-bottom: 20px;
            text-align: center;
            color: #bb86fc;
            font-family: 'Courier New', Courier, monospace;
        }
        label {
            display: center;
            margin-bottom: 5px;
            font-size: 16px;
            width: 100vh;
            font-size: 14px;
            color: #ccc;
        }
        input, select, button {
            padding: 10px;
            border-radius: 5px;
            border: 1px solid #444;
            background: #2a2a2a;
            color: #ffffff;
            width: 100%;
        }
        .loading {
            display: none;
            font-size: 16px;
            color: #bb86fc;
            text-align: center;
        }
        .button-85 {
            padding: 0.6em 2em;
            width: 150px;
            justify-content: center;
            border: none;
            outline: none;
            color: rgb(255, 255, 255);
            background: #111;
            cursor: pointer;
            position: relative;
            z-index: 0;
            border-radius: 10px;
            user-select: none;
            touch-action: manipulation;
        }
        #resultFrom {
            display: none; 
            width: 80vw;
            margin-top: 230px; 
            background: #2a2a2a;
            padding: 20px;
            border-radius: 12px;
            text-align: center;
            box-shadow: 0 0 15px rgba(255, 255, 255, 0.1);
        }
        .result-item {
            display: flex;
            justify-content: space-between;
            padding: 10px;
            border-radius: 8px;
            background: #333;
            color: #fff;
        }
        .result-item h3 {
            color: #bb86fc;
            margin: 0;
        }
        span {
            font-weight: bold;
            font-size: 20px;
            font-family: 'Courier New', Courier, monospace;
        }
        select {
            font-family: 'Courier New', Courier, monospace;
            font-size: 18px;
            font-weight: bold;
            background-color: #2a2a2a;
            border: 1px solid #444;
            padding: 10px;
            border-radius: 5px;
            width: 102vh;
        }

            option {
                font-family: 'Courier New', Courier, monospace;
                font-size: 18px;
                font-weight: bold;
                color: #ffffff; 
                background-color: #333; /
            }

        .result-item:nth-child(even) {
            background: #444;
        }

        .radio-container {
            padding: 10px;
            border: 1px solid #ccc; /* Light grey border for the fieldset */
            width: 300px; /* Adjust as necessary */
        }

        .radio-container legend {
            padding: 0 5px; /* Padding inside the legend */
            margin-bottom: 10px;
            border-bottom: 1px solid #ccc;
        }

        .radio-container label {
            display: block; /* Each label on a new line */
            margin: 5px 0; /* Space between each label */
        }

        .radio-container input[type="radio"] {
            margin-right: 10px; /* Space between radio button and label text */
            width: auto;
        }

        .hidden {
            display: none
        }
    </style>
</head>
<body>

    <form id="dataForm">
        <h2>Fill out the form</h2>

        <fieldset class="radio-container">
            <legend>Select the chromosome representation</legend>
            <label>
                <input type="radio" id="binary_chromosome" name="chromosome_type" value="binary" checked>
                <span>Binary</span>
            </label>
            <label>
                <input type="radio" id="real_chromosome" name="chromosome_type" value="real">
                <span>Real (floating point)</span>
            </label>
        </fieldset>

        <label><span>Population size:</span>
            <input type="number" id="population_size" required>
        </label>
        <label><span>Epochs:</span>
            <input type="number" id="epochs" required>
        </label>
        <label><span>Search range:</span>
            <input type="text" id="search_range" required>
        </label>
        <label class="onlyBinary"><span>Precision:</span>
            <input type="number" id="precision" required>
        </label>
        <label><span>Tournament size:</span>
            <input type="number" id="tournament_size" required>
        </label>
        <label><span>Crossover probability:</span>
            <input type="number" step="0.01" id="crossover_probability" required>
        </label>
        <label><span>Mutation probability:</span>
            <input type="number" step="0.01" id="mutation_probability" required>
        </label>
        <label class="onlyBinary"><span>Inversion probability:</span>
            <input type="number" step="0.01" id="inversion_probability" required>
        </label>
        <label><span>Elitism count:</span>
            <input type="number" id="elitism_count" required>
        </label>
        <label><span>Selection method:</span>
            <select id="selection_method">
                <option value="tournament">Tournament</option>
                <option value="roulette"><span>Roulette</span></option>
                <option value="best"><span>Best</span></option>
            </select>
        </label>
        <label><span>Crossover method:</span>
            <select id="crossover_method">
                <!-- Filled by JS -->
            </select>
        </label>
        <label><span>Mutation method:</span>
            <select id="mutation_method">
                <!-- Filled by JS -->
            </select>
        </label>
        <button class="button-85" role="button" type="submit"><span>Submit</span></button>
        <p class="loading" id="loading">Loading...</p>
    </form>

    <div id="resultFrom">
        <h2>Results</h2>
        <div class="result-item">
            <h3>Best Fitness:</h3>
            <span id="fitness"></span>
        </div>
        <div class="result-item">
            <h3>Best Individual:</h3>
            <span id="individuals"></span>
        </div>
        <div class="result-item">
            <h3>Execution Time:</h3>
            <span id="execution-time"></span>
        </div>
    </div>

    <script>
        var chromosome_type = document.querySelector('input[name="chromosome_type"]:checked').value;
        document.addEventListener('DOMContentLoaded', function () {
            
            const radios = document.querySelectorAll('input[name="chromosome_type"]');
            const visibleOnlyForBinary = Array.from(document.getElementsByClassName('onlyBinary'));
            
            const crossoverSelect = document.getElementById("crossover_method");
            const mutationSelect = document.getElementById("mutation_method");

            const optionsBinary = {
                crossover: [
                    { value: 'one_point', text: 'One Point' },
                    { value: 'two_point', text: 'Two Point' },
                    { value: 'uniform', text: 'Uniform' },
                    { value: 'grain', text: 'Grain' }
                ],
                mutation: [
                    { value: 'one_point', text: 'One Point' },
                    { value: 'two_point', text: 'Two Point' },
                    { value: 'boundary', text: 'Boundary' }
                ]
            }

            const optionsReal = {
                crossover: [
                    { value: 'arithmetic', text: 'Arithmetic'},
                    { value: 'linear', text: 'Linear'},
                    { value: 'mixed_alpha', text: 'Mixed type alpha'},
                    { value: 'mixed_alpha_beta', text: 'Mixed type alpha beta'},
                    { value: 'average', text: 'Average'}
                ],
                mutation: [
                    { value: 'uniform', text: 'Uniform' },
                    { value: 'gauss', text: 'Gauss'}
                ]
            }

            const updateSelect = (selectElement, options) => {
                selectElement.innerHTML = '';
                options.forEach(option => {
                    const opt = document.createElement('option');
                    opt.value = option.value;
                    opt.textContent = option.text;
                    selectElement.appendChild(opt);
                });
            };

            const updateOptions = (type) => {
                const hideOnlyBinary = type === 'real';
                if (hideOnlyBinary) {
                    visibleOnlyForBinary.forEach((elem) => {elem.classList.add("hidden")});
                } else {
                    visibleOnlyForBinary.forEach((elem) => {elem.classList.remove("hidden")});
                }
                
                const { crossover, mutation } = type === 'binary' ? optionsBinary : optionsReal;
                updateSelect(crossoverSelect, crossover);
                updateSelect(mutationSelect, mutation);
            }

            function handleRadioChange(event) {
                chromosome_type = event.target.value;
                updateOptions(chromosome_type);
            }

            radios.forEach(radio => {
                radio.addEventListener('change', handleRadioChange);
            });
            updateOptions(chromosome_type);

        });

        document.getElementById("dataForm").addEventListener("submit", function(event) {
            event.preventDefault();
            document.getElementById("loading").style.display = "block";
            document.getElementById("resultFrom").style.display = "none"; // Ukrywamy sekcję wyników przed wysłaniem danych
            
            const formData = {
                chromosome_representation: chromosome_type,
                function: "hyperellipsoid",
                variables: 10,
                population_size: parseInt(document.getElementById("population_size").value),
                epochs: parseInt(document.getElementById("epochs").value),
                search_range: document.getElementById("search_range").value.split(",").map(Number),
                precision: parseInt(document.getElementById("precision").value),
                optimization_type: "minimization",
                tournament_size: parseInt(document.getElementById("tournament_size").value),
                crossover_probability: parseFloat(document.getElementById("crossover_probability").value),
                mutation_probability: parseFloat(document.getElementById("mutation_probability").value),
                inversion_probability: parseFloat(document.getElementById("inversion_probability").value),
                elitism_count: parseInt(document.getElementById("elitism_count").value),
                selection_method: document.getElementById("selection_method").value,
                crossover_method: document.getElementById("crossover_method").value,
                mutation_method: document.getElementById("mutation_method").value,
                inversion_method: "simple"
            };

            fetch("/run", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(formData)
            })
            .then(response => response.json())
            .then(data => {
                document.getElementById("loading").style.display = "none";
                document.getElementById("resultFrom").style.display = "block"; // Pokazujemy sekcję wyników po otrzymaniu danych
                document.getElementById("fitness").innerHTML = data.best_fitness;
                document.getElementById("individuals").innerHTML = data.best_individual;
                document.getElementById("execution-time").innerHTML = `${data.time.toFixed(4)} sekundy`;
            })
            .catch(error => {
                console.error("Error:", error);
                document.getElementById("loading").style.display = "none";
            });
        });
    </script>

</body>
</html>
